<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      padding: 20px;
      background: #fff;
      color: #1a1a1a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    .header img {
      width: 28px;
      height: 28px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #111;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    .input-group {
      margin-bottom: 16px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
      width: 100%;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      width: 100%;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
    }
    .status {
      font-size: 12px;
      color: #16a34a;
      margin-top: 8px;
      min-height: 18px;
    }
    .current-link {
      margin-top: 16px;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      word-break: break-all;
      color: #475569;
      display: none;
    }
    .current-link .label {
      font-weight: 600;
      color: #374151;
      display: block;
      margin-bottom: 4px;
    }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }
    .footer a {
      color: #2563eb;
      text-decoration: none;
      font-size: 12px;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon-48.png" alt="Calendo">
    <h1>Calendo</h1>
  </div>

  <div class="input-group">
    <label for="booking-link">Your Calendo booking link</label>
    <input type="text" id="booking-link" placeholder="https://calendo.dev/booking/username">
  </div>

  <button class="btn btn-primary" id="save-btn">Save</button>
  <button class="btn btn-secondary" id="copy-btn">Copy Link</button>

  <div class="status" id="status"></div>

  <div class="current-link" id="current-link">
    <span class="label">Saved link:</span>
    <span id="saved-url"></span>
  </div>

  <div class="footer">
    <a href="https://calendo.dev/dashboard" target="_blank">Open Calendo Dashboard</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
