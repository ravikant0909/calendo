name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the built-in GITHUB_TOKEN (this repo will be public).
permissions:
  contents: read

jobs:
  worker-and-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: HUSKY=0 npm ci
      - run: npm run test:worker
      - run: npm run test:client

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: HUSKY=0 npm ci
      - run: npm run test:schema

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: HUSKY=0 npm ci
      - run: npm run test:smoke

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: HUSKY=0 npm ci
      - run: npx playwright install --with-deps chromium
      # CI runs only the launch-critical booking flow (the gate). The broader
      # tests/e2e suite is quarantined — see tests/e2e/README.md. Run the full
      # suite locally with `npm run test:e2e`.
      - run: npm run test:e2e:ci
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
