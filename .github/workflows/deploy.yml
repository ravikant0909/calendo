name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Least privilege for the built-in GITHUB_TOKEN (this repo will be public).
permissions:
  contents: read

jobs:
  deploy:
    # Only deploy CI runs from a real push to main in THIS repo. Without the
    # event/repository checks, a pull request from a fork whose branch is named
    # "main" would trigger a deploy of the fork's code with our secrets.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: HUSKY=0 npm ci
      - run: npm run test:ci
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
